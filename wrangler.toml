name = "krisshaw-portfolio"
main = "worker.mjs"
compatibility_date = "2026-11-16"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
# The Worker rewrites SPA routes to /index.html internally. Do not redirect
# that asset back to /, which would send the browser into a redirect loop.
html_handling = "none"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "krisshaw-portfolio"

[vars]
# Replace these with your Cloudflare Access application values.
CF_ACCESS_TEAM_DOMAIN = ""
CF_ACCESS_AUD = ""
ADMIN_EMAIL = ""
